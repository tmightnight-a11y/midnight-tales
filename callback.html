<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Midnight Tales — Connecting...</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0a0a0f; --surface: #12121a; --surface2: #1a1a26;
      --border: #2a2a3d; --accent: #7c3aed; --accent2: #a855f7;
      --green: #22c55e; --red: #ef4444; --text: #e2e8f0; --muted: #94a3b8;
    }
    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: var(--bg); color: var(--text);
      min-height: 100vh; display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      padding: 2rem; position: relative; overflow: hidden;
    }
    body::before {
      content: ''; position: fixed; inset: 0; pointer-events: none;
      background: radial-gradient(ellipse 70% 50% at 50% 0%, rgba(124,58,237,0.2) 0%, transparent 70%);
    }
    .brand { position: fixed; top: 1.5rem; left: 1.5rem; font-size: 1rem; font-weight: 700; color: var(--text); text-decoration: none; }
    .brand span { color: var(--accent2); }
    .card {
      background: var(--surface); border: 1px solid var(--border); border-radius: 20px;
      padding: 3rem 2.5rem; max-width: 480px; width: 100%;
      text-align: center; position: relative; z-index: 1;
    }

    /* Spinner ring */
    .spinner-wrap { position: relative; width: 5rem; height: 5rem; margin: 0 auto 1.75rem; }
    .spinner-ring {
      width: 5rem; height: 5rem; border-radius: 50%;
      border: 3px solid var(--border); border-top-color: var(--accent2);
      animation: spin 0.9s linear infinite;
    }
    .spinner-icon {
      position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
      font-size: 1.5rem;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Success ring */
    .success-wrap {
      width: 5rem; height: 5rem; border-radius: 50%; margin: 0 auto 1.75rem;
      background: rgba(34,197,94,0.1); border: 2px solid rgba(34,197,94,0.4);
      display: flex; align-items: center; justify-content: center; font-size: 2rem;
    }
    /* Error ring */
    .error-wrap {
      width: 5rem; height: 5rem; border-radius: 50%; margin: 0 auto 1.75rem;
      background: rgba(239,68,68,0.1); border: 2px solid rgba(239,68,68,0.35);
      display: flex; align-items: center; justify-content: center; font-size: 2rem;
    }

    h1 { font-size: 1.5rem; font-weight: 700; margin-bottom: 0.5rem; }
    .subtitle { color: var(--muted); font-size: 0.9rem; margin-bottom: 1.75rem; line-height: 1.55; }

    .progress-bar { height: 4px; background: var(--surface2); border-radius: 999px; overflow: hidden; margin-bottom: 0.75rem; }
    .progress-fill { height: 100%; background: linear-gradient(90deg, var(--accent), var(--accent2)); border-radius: 999px; width: 0%; transition: width 0.1s linear; }
    .progress-label { font-size: 0.75rem; color: var(--muted); }

    .info-box {
      background: rgba(124,58,237,0.08); border: 1px solid rgba(124,58,237,0.2);
      border-radius: 10px; padding: 1rem 1.25rem; margin-top: 1.5rem; text-align: left;
    }
    .info-box p { font-size: 0.8rem; color: var(--muted); line-height: 1.55; }
    .info-box strong { color: var(--text); }

    .btn-back { display: inline-flex; align-items: center; gap: 0.4rem; margin-top: 1.5rem; color: var(--muted); font-size: 0.85rem; text-decoration: none; transition: color 0.2s; }
    .btn-back:hover { color: var(--text); }

    /* Error styles */
    .error-box { background: rgba(239,68,68,0.07); border: 1px solid rgba(239,68,68,0.25); border-radius: 10px; padding: 1rem 1.25rem; margin-bottom: 1.25rem; text-align: left; }
    .error-box p { font-size: 0.82rem; color: var(--muted); }
    .error-box strong { color: var(--red); }
  </style>
</head>
<body>

  <a href="index.html" class="brand">🌙 Midnight <span>Tales</span></a>
  <div class="card" id="card"></div>

  <script>
    const params  = new URLSearchParams(window.location.search);
    const code    = params.get('code');
    const error   = params.get('error');
    const errDesc = params.get('error_description');
    const card    = document.getElementById('card');
    const REDIRECT_DELAY = 3000; // ms

    function esc(s) {
      return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    if (error) {
      // ── ERROR ──
      card.innerHTML = `
        <div class="error-wrap">❌</div>
        <h1>Authorization Failed</h1>
        <p class="subtitle">${errDesc ? esc(errDesc) : 'TikTok declined the authorization request.'}</p>
        <div class="error-box">
          <p><strong>Error:</strong> ${esc(error)}</p>
          ${errDesc ? `<p style="margin-top:0.35rem;">${esc(errDesc)}</p>` : ''}
        </div>
        <div class="info-box">
          <p>Make sure you <strong>approve all permissions</strong> when TikTok asks. If the problem persists, contact <strong>tmightnight@gmail.com</strong>.</p>
        </div>
        <a href="index.html" class="btn-back">← Back to Midnight Tales</a>
      `;

    } else if (code) {
      // ── SUCCESS → redirect to dashboard ──
      card.innerHTML = `
        <div class="success-wrap">✅</div>
        <h1>Authorization Successful!</h1>
        <p class="subtitle">TikTok connected. Redirecting you to your dashboard…</p>
        <div class="progress-bar"><div class="progress-fill" id="bar"></div></div>
        <p class="progress-label" id="countdown">Redirecting in 3 seconds…</p>
        <div class="info-box">
          <p>Your TikTok account is now linked to <strong>Midnight Tales</strong>. You're ready to create and publish mystery videos.</p>
        </div>
      `;

      // Animate progress bar and countdown
      const bar       = document.getElementById('bar');
      const countdown = document.getElementById('countdown');
      const start     = Date.now();
      const tick = setInterval(() => {
        const elapsed = Date.now() - start;
        const pct     = Math.min(100, (elapsed / REDIRECT_DELAY) * 100);
        bar.style.width = pct + '%';
        const secs = Math.ceil((REDIRECT_DELAY - elapsed) / 1000);
        countdown.textContent = secs > 0 ? `Redirecting in ${secs} second${secs !== 1 ? 's' : ''}…` : 'Redirecting…';
        if (elapsed >= REDIRECT_DELAY) {
          clearInterval(tick);
          window.location.href = 'dashboard.html';
        }
      }, 50);

    } else {
      // ── NO PARAMS ──
      card.innerHTML = `
        <div class="spinner-wrap">
          <div class="spinner-ring"></div>
          <div class="spinner-icon">⚠️</div>
        </div>
        <h1>Nothing to process</h1>
        <p class="subtitle">This page handles your TikTok authorization. It should be opened automatically after you connect your account.</p>
        <div class="info-box">
          <p>Go back to <strong>Midnight Tales</strong>, click <strong>Login with TikTok</strong>, approve the permissions, and you'll land here automatically.</p>
        </div>
        <a href="index.html" class="btn-back">← Back to Midnight Tales</a>
      `;
    }
  </script>
</body>
</html>
